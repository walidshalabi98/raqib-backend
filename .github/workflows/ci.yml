name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raqib
          POSTGRES_PASSWORD: raqib
          POSTGRES_DB: raqib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raqib -d raqib_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Disposable CI database; never a shared one.
      DATABASE_URL: postgresql://raqib:raqib@localhost:5432/raqib_test
      DIRECT_URL: postgresql://raqib:raqib@localhost:5432/raqib_test
      TEST_DATABASE_URL: postgresql://raqib:raqib@localhost:5432/raqib_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Create test database schema
        run: npx prisma db push --skip-generate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
